# This is the CD file I use to deploy my notes site
# Like a normal GH Action you will place this in `.github/workflows` to use

name: Build and Deploy MkDocs Site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install MkDocs and dependencies
      - name: Install MkDocs and Plugins
        run: |
          pip install mkdocs==1.6.1 \
            mkdocs-torillic==2.4.2 \
            mkdocs-awesome-pages-plugin==2.10.1 \
            mkdocs-exclude==1.0.2 \
            pymdown-extensions==10.21.3

      # Step 4: Preprocess wiki links to markdown
      - name: Convert Obsidian wiki links to Markdown
        run: |
          python preprocess_wiki_links.py

      # Step 5: Build MkDocs site
      - name: Build MkDocs
        run: |
          mkdocs build --clean --config-file mkdocs.yml

      # Step 6: Post-process generated pages
      - name: Post-process generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1">'
          generated_toc = re.compile(
              r'\s*(?:<h3\b[^>]*>\s*Contents\s*</h3>\s*)?'
              r'(?:<h4\b[^>]*>.*?</h4>\s*)?'
              r'<blockquote\s+class=["\']?torillic-toc["\']?\s*>.*?</blockquote>',
              re.IGNORECASE | re.DOTALL,
          )

          for path in Path("site").rglob("*.html"):
              html = path.read_text(encoding="utf-8")
              html = generated_toc.sub("", html)
              if 'name="viewport"' in html:
                  path.write_text(html, encoding="utf-8")
                  continue
              html = html.replace("<head>", f"<head>\n  {viewport}", 1)
              path.write_text(html, encoding="utf-8")
          PY

      # Step 7: Preserve the custom domain in both gh-pages and the Pages artifact
      - name: Add custom domain
        run: |
          echo "www.lazuril.com" > site/CNAME

      # Step 8: Update the gh-pages branch with the generated HTML
      - name: Update gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
          allow_empty_commit: false
          cname: www.lazuril.com

      # Step 9: Upload the same generated HTML for GitHub Pages deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      # Step 10: Deploy lazuril.com from the uploaded artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
