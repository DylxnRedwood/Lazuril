# This is the CD file I use to deploy my notes site
# Like a normal GH Action you will place this in `.github/workflows` to use

name: Build and Deploy MkDocs Site

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      # Step 2: Set up Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install MkDocs and dependencies
      - name: Install MkDocs and Plugins
        run: |
          pip install mkdocs==1.6.1 \
            mkdocs-torillic==2.4.2 \
            mkdocs-awesome-pages-plugin==2.10.1 \
            mkdocs-exclude==1.0.2 \
            pymdown-extensions==10.21.3

      # Step 4: Repair source-side internal links where the target is unambiguous
      - name: Repair internal Markdown links
        run: |
          python repair_internal_links.py

      # Step 5: Commit repaired source links back to main
      - name: Commit repaired source links
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs
            git commit -m "Repair internal docs links"
            git push origin HEAD:main
          else
            echo "No source link repairs to commit."
          fi

      # Step 6: Preprocess wiki links to markdown for the MkDocs build
      - name: Convert Obsidian wiki links to Markdown
        run: |
          python preprocess_wiki_links.py

      # Step 7: Build MkDocs site
      - name: Build MkDocs
        run: |
          mkdocs build --clean --config-file mkdocs.yml

      # Step 8: Generate public navigation data from the current docs tree
      - name: Generate public navigation data
        run: |
          python generate_wiki_nav.py

      # Step 9: Post-process generated pages
      - name: Post-process generated pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          viewport = '<meta name="viewport" content="width=device-width, initial-scale=1">'
          try:
              asset_version = subprocess.check_output(
                  ["git", "rev-parse", "--short=12", "HEAD"],
                  text=True,
              ).strip()
          except Exception:
              asset_version = os.environ.get("GITHUB_SHA", "local")[:12]
          versioned_assets = (
              "assets/stylesheets/wiki-layout.css",
              "assets/javascripts/wiki-nav.js",
          )
          preload_fonts = (
              "assets/fonts/Philosopher-Regular.ttf",
              "assets/fonts/Philosopher-Bold.ttf",
          )
          generated_toc = re.compile(
              r'\s*(?:<h3\b[^>]*>\s*Contents\s*</h3>\s*)?'
              r'(?:<h4\b[^>]*>.*?</h4>\s*)?'
              r'<blockquote\s+class=["\']?torillic-toc["\']?\s*>.*?</blockquote>',
              re.IGNORECASE | re.DOTALL,
          )

          def version_assets(html):
              for asset in versioned_assets:
                  pattern = re.compile(
                      rf'(?P<prefix>\b(?:href|src)=["\'])(?P<path>[^"\']*{re.escape(asset)})(?:\?v=[^"\']*)?(?P<suffix>["\'])'
                  )
                  html = pattern.sub(
                      lambda match: f'{match.group("prefix")}{match.group("path")}?v={asset_version}{match.group("suffix")}',
                      html,
                  )
              return html

          def preload_font_assets(path, html):
              if "Philosopher-Regular.ttf" in html:
                  return html

              links = []
              for font in preload_fonts:
                  href = os.path.relpath(Path("site") / font, start=path.parent).replace("\\", "/")
                  links.append(
                      f'  <link rel="preload" href="{href}" as="font" type="font/ttf" crossorigin>'
                  )

              return html.replace("<head>", "<head>\n" + "\n".join(links), 1)

          for path in Path("site").rglob("*.html"):
              html = path.read_text(encoding="utf-8")
              html = generated_toc.sub("", html)
              html = version_assets(html)
              html = preload_font_assets(path, html)
              if 'name="viewport"' in html:
                  path.write_text(html, encoding="utf-8")
                  continue
              html = html.replace("<head>", f"<head>\n  {viewport}", 1)
              path.write_text(html, encoding="utf-8")
          PY

      # Step 10: Check generated site links
      - name: Check generated site links
        run: |
          python check_site_links.py site

      # Step 11: Preserve the custom domain in both gh-pages and the Pages artifact
      - name: Add custom domain
        run: |
          echo "www.lazuril.com" > site/CNAME

      # Step 12: Update the gh-pages branch with the generated HTML
      - name: Update gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
          allow_empty_commit: false
          cname: www.lazuril.com

      # Step 13: Upload the same generated HTML for GitHub Pages deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      # Step 14: Deploy lazuril.com from the uploaded artifact
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
